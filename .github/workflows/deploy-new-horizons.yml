name: Deploy new-horizons

# Only asks. new-horizons builds and switches on its own afterwards and reports
# back through deploy-report.yml, so this run is green once the request is
# queued, not once the host is deployed.

on:
  push:
    branches: [master]
    # Nothing here reaches new-horizons. Anything else that turns out not to
    # change it costs one evaluation on the host, which then reports no change.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "hosts/charon/**"
      - "hosts/kerberos/**"
      - "hosts/nyx/**"
      - "lefthook.yaml"
      - ".github/workflows/deploy-report.yml"
  workflow_dispatch:

concurrency:
  group: deploy-new-horizons
  cancel-in-progress: true

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The address lives in a secret, so it stays out of the repository and
      # the logs, and a move is one secret to update. The host key is checked
      # under the name rather than the address, so it survives the move.
      - name: Queue a deploy on new-horizons
        env:
          HOST: ${{ secrets.NEW_HORIZONS_HOST }}
          DEPLOY_KEY: ${{ secrets.NEW_HORIZONS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.NEW_HORIZONS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o HostKeyAlias=new-horizons \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            deploy@"$HOST" "$GITHUB_SHA"
