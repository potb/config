# jcode configuration, owned by nix.
#
# Only values that differ from jcode's built-in defaults are listed. Every
# section is #[serde(default)], so anything omitted falls back to the default.
# This file is reinstalled over ~/.jcode/config.toml on every switch.

[keybindings]
scroll_up = "ctrl+shift+k"
scroll_down = "ctrl+shift+j"
scroll_prompt_up = "ctrl+k"
scroll_prompt_down = "ctrl+j"

[display]
show_thinking = false
reasoning_display = "off"

[tools]
disabled = ["browser"]

[provider]
default_provider = "claude"
default_model = "claude-opus-5-5"
anthropic_reasoning_effort = "low"
cross_provider_failover = "manual"

[agents]
swarm_model = "claude-sonnet-5"

[hooks]
pre_tool = "~/.jcode/hooks/dispatch"
post_tool = "~/.jcode/hooks/dispatch"
