name: mail-reader
description: Used only by the mail command. Reads Gmail messages, threads and attachments, changes nothing.

version: true

gmail:
  search: true
  get: true
  messages:
    search: true
  attachment: true
  history: true
  thread:
    get: true
    attachments: true

locked-flags:
  wrap-untrusted: true
  no-input: true
  gmail-no-send: true
  readonly: true
